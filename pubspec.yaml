name: prism
description: "An elegant offline markdown journal and personal notebook"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Storage
  sqflite: ^2.4.2                   # SQLite database with FTS5
  sqflite_sqlcipher: ^3.4.0         # Encrypted SQLite database with FTS5
  sqflite_common_ffi: ^2.4.0+3     # FFI database engine for Windows/Linux
  sqlite3_flutter_libs: ^0.5.27    # Bundled SQLite with FTS5 for Android emulators
  path_provider: ^2.1.5             # Device document directory
  path: ^1.9.1                      # Path utilities

  # Vault export
  archive: ^4.0.2                   # ZIP creation for vault export
  pdf: ^3.11.2                      # PDF generation for vault export

  # Markdown rendering
  flutter_markdown_plus: ^1.0.0     # Markdown display widget (successor to flutter_markdown)
  markdown: ^7.3.0                  # Markdown parser

  # State management
  flutter_riverpod: ^2.6.1          # State management
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^15.1.2                # Declarative routing

  # UI & Animations
  google_fonts: ^6.2.1              # Inter, Merriweather, JetBrains Mono
  flutter_animate: ^4.5.2           # Smooth micro-animations
  smooth_page_indicator: ^1.2.1     # Onboarding dot indicators

  # Graph / Graph View
  graphview: ^1.2.1                 # Force-directed graph visualization

  # Date & Time
  intl: ^0.20.1                     # Date formatting
  table_calendar: ^3.1.3            # Calendar widget for Journal tab

  # Utilities
  uuid: ^4.5.1                      # Unique ID generation for notes
  shared_preferences: ^2.3.5       # Simple key-value persistence (settings)
  flutter_secure_storage: ^9.2.2    # Secure credential storage
  file_picker: ^8.3.7               # Import existing vault
  collection: ^1.18.0

  # Speech & Audio
  record: ^6.2.1
  audioplayers: ^6.0.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  purchases_flutter: ^10.3.0
  purchases_ui_flutter: ^10.3.0
  fpdart: ^1.2.0
  cryptography: ^2.9.0
  google_sign_in: ^6.2.1
  googleapis: ^11.4.0
  googleapis_auth: ^1.6.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.1
  http: ^1.2.0

  flutter_localizations:
    sdk: flutter

  # Firebase & Analytics
  firebase_core: ^3.10.0
  firebase_analytics: ^11.4.0
  firebase_crashlytics: ^4.3.0


  # Code generation
  freezed_annotation: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.4
  json_annotation: ^4.9.0
  json_serializable: ^6.9.5
  freezed: ^2.5.7
  vector_math: ^2.2.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - google_fonts/

